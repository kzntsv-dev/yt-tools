name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      # Two legs, one question each ([[task:2842]]): does the suite survive a real
      # light-core install — the one a first-time user gets, and the one no job
      # ran before — and does it still run everything when the extras are there?
      # Until this existed, `pytest` only ever ran on `[full,ocr]`, so a test that
      # imported an extra in its body ([[issue:75]]) reddened light installs while
      # CI stayed green. The `core only` leg is cheap by construction (two small
      # dependencies); the `full extras` leg keeps the heavy stacks on purpose:
      # a handful of tests exercise the real audio and OCR pipelines rather than a
      # mock, and `[ocr]` is in the list because the whole suite once mocked the
      # engine factory while the published extra resolved to a rapidocr whose
      # params schema yt-ocr does not speak — a clean `pipx install
      # "yt-tools-cli[ocr]"` broke with the suite green ([[task:2831]]).
      # tests/test_ocr_engine.py drives the real engine and needs the network
      # once, for the ~10 MB PP-OCRv5 model.
      #
      # `frames only` ([frames,test]) asks the question the full leg cannot
      # ([[task:2844]]): on `full,ocr`, `cv2` also arrives through rapidocr, so a
      # `[frames]` that stopped delivering opencv would stay green there while
      # `pipx install 'yt-tools-cli[frames]'` gave a `yt-frames` without cv2.
      #
      # `expect` is the leg's claim about what it installs: the gate fails a leg
      # whose declared extra is not importable, so an install that silently drops
      # a dependency cannot masquerade as a leg that never had the extra (every
      # gated test would skip "legitimately" — the [[issue:77]] shape).
      #
      # Adding a leg is one line of matrix plus its claim; the gate itself needs
      # no per-leg configuration.
      fail-fast: false
      matrix:
        include:
          - leg: core only
            extras: test
            expect: ""
          - leg: frames only
            extras: frames,test
            expect: frames
          - leg: full extras
            extras: full,ocr,test
            expect: frames,audio,ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (${{ matrix.leg }})
        run: pip install -e ".[${{ matrix.extras }}]"
      # `-rs` prints every skip with its reason, which is the report the gate
      # reads: on a leg without an extra its gated tests must skip *naming* the
      # extra, and on a leg with it they must not skip at all.
      # `--extras-gate-floors` additionally pins how many gated tests the full
      # suite must contain (a gate that quietly loses its tests would otherwise
      # pass on nothing) and `--extras-gate-expect` pins what this leg claims to
      # have installed (tests/conftest.py, tests/extras_gate.py).
      - name: Unit + CLI smoke tests + extras gate
        run: pytest -q -rs --extras-gate-floors --extras-gate-expect="${{ matrix.expect }}"

  ocr-engine-matrix:
    name: ocr engine (rapidocr ${{ matrix.rapidocr }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs are the point: `[ocr]` is a pin on a third-party params API,
      # and release 0.24.0/0.24.1 shipped broken because the *newer* minor was
      # never exercised — the engine factory was mocked in every test, so the
      # suite was green while a clean install could not construct the engine at
      # all ([[issue:77]], [[task:2831]]). 0.25.0 names every model version and
      # model type explicitly ([[task:2833]]); the verified minors live here and
      # in the `[ocr]` bound, and tests/test_packaging.py asserts the two agree.
      fail-fast: false
      matrix:
        rapidocr: ["3.8.4", "3.9.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `[ocr]` alone is enough: the engine tests need rapidocr, onnxruntime and
      # cv2 (a rapidocr dependency) — nothing from [full] or [audio]. The second
      # install pins the leg, since the extra's bound spans both.
      - name: Install ([ocr] at ${{ matrix.rapidocr }})
        run: |
          python -m pip install -e ".[ocr,test]"
          python -m pip install "rapidocr==${{ matrix.rapidocr }}"
      # First construction downloads the ~8 MB model, so this leg needs network —
      # the same prerequisite the `tests` job already carries for the model calls
      # it makes.
      - name: Engine tests
        run: pytest -q -rs tests/test_ocr_engine.py tests/test_ocr.py

  build:
    name: build (sdist + wheel, publishable metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      # The release job builds these same artifacts on a tag. Running the build
      # here too is cheap insurance: a packaging mistake should cost a red CI
      # run, not a burned version number. v0.23.0 is the case in point — build
      # green, `twine check` green, and PyPI answered 400 on upload because a
      # `Requires-Dist` carried a direct reference (`bpm-detector @ git+…`).
      - name: Build + twine check
        run: |
          python -m build
          python -m twine check dist/*
      - name: Publishable metadata (no direct refs, no dev-repo meta)
        run: python scripts/check-metadata.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  gate:
    name: install contract (AC4/AC5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs itself inside python:3.12-slim: core install without extras, once
      # without ffmpeg and once with a real static one, then checks that `warn`
      # and `missing` stay machine-distinguishable in one --json payload.
      - name: Core-install gate
        run: bash scripts/check-core-install.sh
