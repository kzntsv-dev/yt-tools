[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-tools-cli"
version = "0.25.0"
description = "CLI suite for iterative YouTube watching by LLM agents: transcript with [mm:ss] anchors, targeted frame extraction, FFT audio analysis (BPM, key, chord progression, spectral features), and OCR over cached frames for silent-with-text videos."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Victor Kuznetsov" }]
keywords = [
    "youtube",
    "transcript",
    "agent",
    "claude",
    "audio-analysis",
    "fft",
    "bpm",
    "iterative",
    "yt-dlp",
    "ffmpeg",
    "librosa",
    "music-information-retrieval",
    "ocr",
    "rapidocr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Light flows only: transcript, metadata, comments, search, cache. Everything
# else is an extra — a plain `pip install .` must not pull opencv/librosa/
# matplotlib ([[requirements:46]] D1).
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2025.0.0",
]

[project.optional-dependencies]
# yt-frames (--mode scene) and yt-watch scene detection.
frames = [
    "scenedetect[opencv]>=0.6.4",
]
# yt-listen — spectral features, spectrogram rendering, librosa-only fallback.
# Capped below 1.0: bpm-detector 1.1.0 calls ``librosa.beat.tempo``, removed in
# librosa 1.0 — an uncapped range resolves to a combination where yt-listen
# raises inside the third-party dep, both for the injected bpm-detector (hook)
# and for any user-added one. Drop the cap once bpm-detector supports 1.x.
audio = [
    "librosa>=0.11.0,<1.0",
    "matplotlib>=3.8",
]
# The agent default (plugin SessionStart hook). Identical requirement strings
# to [frames] and [audio] (PEP 621 has no self-extras; a test pins them to the
# letter). NOT [ocr]: the ONNX model is a ~10 MB lazy download and is always an
# explicit install (D3).
#
# bpm-detector is deliberately absent: it is not on PyPI, so it can only be a
# PEP 508 direct reference — and PyPI rejects those in Requires-Dist with
# "400 Can't have direct dependency" at upload time. It builds fine, so the
# failure would only surface on a tag. The plugin hook injects it on top of
# this extra, best-effort (scripts/ensure-install.sh); a PyPI user adds it with
# `pipx inject`. See [[requirements:46]] D3.
full = [
    "scenedetect[opencv]>=0.6.4",
    "librosa>=0.11.0,<1.0",
    "matplotlib>=3.8",
]
ocr = [
    # Pinned to the 3.x params API ([[task:2833]]). Within it, `ocr.py` names
    # *everything* explicitly — `Det/Cls/Rec.ocr_version` and the matching
    # `model_type`, plus the recognizer version per language — so the config no
    # longer depends on whatever defaults the installed release ships. That was
    # the 0.24.2 bug ([[issue:77]]): 3.8 defaulted to PP-OCRv4+mobile, 3.9 moved
    # Det/Rec to PP-OCRv6+small, and PP-OCRv5 has no `small`, so a version-only
    # pin asked for a model that does not exist and construction raised
    # `error: Invalid OCR configuration`. Verified against 3.8.4 and 3.9.2 for
    # every `--language` (CI matrix: .github/workflows/ci.yml); the major bound
    # is what a params-API change would break, so it stays.
    "rapidocr>=3.8,<4",
    "onnxruntime>=1.18",
]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/kzntsv-dev/yt-tools"
Repository = "https://github.com/kzntsv-dev/yt-tools"
Issues = "https://github.com/kzntsv-dev/yt-tools/issues"

[project.scripts]
yt-transcript = "yt_tools.transcript:main"
yt-meta = "yt_tools.meta:main"
yt-comments = "yt_tools.comments:main"
yt-search = "yt_tools.search:main"
yt-ocr = "yt_tools.ocr:main"
yt-frames = "yt_tools.frames:main"
yt-watch = "yt_tools.watch:main"
yt-listen = "yt_tools.listen:main"
yt-tools = "yt_tools.cli:main"

[tool.hatch.build.targets.sdist]
# Dev-repo meta must never reach a published sdist. The curated pub tree drops
# these files, but a build run in the dev tree picks up everything git does not
# ignore — and dev's .gitignore deliberately keeps them (its negations mirror
# pub's backstop). Belt is the curated copy, braces are this list; the artifact
# is checked by scripts/check-metadata.py in CI and again before the upload.
exclude = [
    "AGENTS.md",
    "CLAUDE.md",
    ".mappa",
    ".mappa-manifest.json",
    ".pi",
    ".wiki",
    ".tasks",
]

[tool.hatch.build.targets.wheel]
packages = ["yt_tools"]
