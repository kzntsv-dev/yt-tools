[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-tools"
version = "0.22.0"
description = "CLI suite for iterative YouTube watching by LLM agents: transcript with [mm:ss] anchors, targeted frame extraction, FFT audio analysis (BPM, key, chord progression, spectral features), and OCR over cached frames for silent-with-text videos."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Victor Kuznetsov" }]
keywords = [
    "youtube",
    "transcript",
    "agent",
    "claude",
    "audio-analysis",
    "fft",
    "bpm",
    "iterative",
    "yt-dlp",
    "ffmpeg",
    "librosa",
    "music-information-retrieval",
    "ocr",
    "rapidocr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Light flows only: transcript, metadata, comments, search, cache. Everything
# else is an extra — a plain `pip install .` must not pull opencv/librosa/
# matplotlib ([[requirements:46]] D1).
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2025.0.0",
]

[project.optional-dependencies]
# yt-frames (--mode scene) and yt-watch scene detection.
frames = [
    "scenedetect[opencv]>=0.6.4",
]
# yt-listen — spectral features, spectrogram rendering, librosa-only fallback.
# Capped below 1.0: bpm-detector 1.1.0 calls ``librosa.beat.tempo``, removed in
# librosa 1.0 — an uncapped range resolves to a combination where yt-listen
# raises inside the third-party dep. Drop the cap once bpm-detector supports 1.x.
audio = [
    "librosa>=0.11.0,<1.0",
    "matplotlib>=3.8",
]
# The agent default (plugin SessionStart hook) — same dist set as the pre-0.14
# default install (core + frames + audio + bpm-detector), so the agent path pays
# nothing new. NOT [ocr]: the ONNX model is a ~10 MB lazy download and is always
# an explicit install (D3).
full = [
    "scenedetect[opencv]>=0.6.4",
    "librosa>=0.11.0,<1.0",
    "matplotlib>=3.8",
    "bpm-detector @ git+https://github.com/libraz/bpm-detector@v1.1.0",
]
ocr = [
    "rapidocr>=3.8",
    "onnxruntime>=1.18",
]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/kzntsv-dev/yt-tools"
Repository = "https://github.com/kzntsv-dev/yt-tools"
Issues = "https://github.com/kzntsv-dev/yt-tools/issues"

[project.scripts]
yt-transcript = "yt_tools.transcript:main"
yt-meta = "yt_tools.meta:main"
yt-comments = "yt_tools.comments:main"
yt-search = "yt_tools.search:main"
yt-ocr = "yt_tools.ocr:main"
yt-frames = "yt_tools.frames:main"
yt-watch = "yt_tools.watch:main"
yt-listen = "yt_tools.listen:main"
yt-tools = "yt_tools.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["yt_tools"]
